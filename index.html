<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ペアタップ</title>
    <meta property="og:title" content="ペアタップ">
    <meta property="og:description" content="【自立活動】視覚探索/目と手の協応を鍛えるマッチングゲームアプリです。">
    <meta property="og:type" content="website">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');

        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* アニメーション定義 */
        .shake-anim {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .pop-anim {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse-start {
            animation: pulseStart 1.8s infinite ease-in-out;
        }

        @keyframes pulseStart {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 15px 30px -5px rgba(244, 114, 182, 0.8); }
        }

        /* 16:9コンテナ用レスポンシブ枠指定 */
        .aspect-16-9-box {
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-height: 96vh;
            max-width: calc(96vh * 16 / 9);
        }
    </style>
</head>
<body class="bg-pink-100 flex items-center justify-center min-h-screen m-0 overflow-hidden p-1 sm:p-2">

    <!-- 16:9固定フレームコンテナ -->
    <div id="app-container" class="aspect-16-9-box relative bg-pink-50 rounded-2xl sm:rounded-3xl shadow-2xl border-4 sm:border-8 border-pink-200 overflow-hidden flex flex-col justify-between">

        <!-- ================= 1. トップ画面（設定・スタート） ================= -->

                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>

        <!-- ================= 3. ボーナスステージ画面 ================= -->

            <!-- ヘッダー -->
            <div class="w-full flex items-center justify-between px-3 py-1.5 bg-white/80 rounded-xl sm:rounded-2xl border border-pink-200 shadow-sm z-20">
                <div class="text-purple-600 font-black text-sm sm:text-xl">
                    ボーナスステージ
                </div>
                <div class="text-rose-500 font-black text-base sm:text-2xl" id="bonus-timer">
                    タイム: 60
                </div>
                <div class="text-pink-700 font-black text-sm sm:text-xl" id="bonus-score">

            </div>

            <div class="w-full flex-1 flex items-center justify-center p-2">
                <div id="bonus-grid" class="grid grid-cols-4 grid-rows-4 gap-2 sm:gap-3 w-full max-w-lg h-full max-h-lg">

            <!-- ボーナス終了時オーバーレイ -->

                    クリア！
                </div>
                <div class="text-yellow-200 font-black text-xl sm:text-3xl drop-shadow-md" id="bonus-final-score">
                    ごうけい てんすう: 0

                <button type="button" onclick="nextStageFromBonus()" class="bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-black text-xl sm:text-3xl px-8 sm:px-12 py-3 rounded-full border-2 border-white shadow-xl transition-transform hover:scale-105 active:scale-95 mt-2">
                    つぎのステージへ
                </button>
            </div>

        </div>

    </div>

    <!-- ================= スクリプト処理 ================= -->
    <script>
        /* ----------------------------------------------------
           1. 音響 (Web Audio API)
        ---------------------------------------------------- */
        const sound = {
            ctx: null,
            isMuted: false,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq, type, duration, vol = 0.1) {
                if (this.isMuted) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            toggleMute() {
                this.isMuted = !this.isMuted;
                this.updateMuteIcon();
                if (!this.isMuted) {
                    this.playSelect();
                }
            },
            updateMuteIcon() {
                const btn = document.getElementById('btn-sound-toggle');
                if (!btn) return;
                if (this.isMuted) {
                    btn.innerHTML = `<svg class="w-4 h-4 sm:w-5 sm:h-5 fill-pink-400" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
                    btn.classList.add('bg-pink-200/60');
                    btn.classList.remove('bg-pink-100');
                } else {
                    btn.innerHTML = `<svg class="w-4 h-4 sm:w-5 sm:h-5 fill-pink-600" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
                    btn.classList.add('bg-pink-100');
                    btn.classList.remove('bg-pink-200/60');
                }
            },
            playSelect() { this.playTone(523.25, 'sine', 0.08, 0.1); },
            playCorrect() {
                this.playTone(659.25, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(880.00, 'sine', 0.2, 0.15), 100);
            },
            playWrong() {
                this.playTone(220, 'sawtooth', 0.15, 0.15);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.2, 0.15), 120);
            },
            playTimeUp() {
                this.playTone(300, 'triangle', 0.2, 0.15);
                setTimeout(() => this.playTone(200, 'triangle', 0.3, 0.15), 180);
            },
            playFanfare() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((n, idx) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.25, 0.15), idx * 120);
                });
            }
        };

        /* ----------------------------------------------------
           2. 定数・データ定義（全16種類の完全ユニーク形状）
        ---------------------------------------------------- */
        const SHAPES = [
            'circle', 'square', 'triangle', 'star', 'heart', 
            'diamond', 'hexagon', 'pentagon', 'cross', 'cloud', 
            'flower', 'crescent', 'ring', 'drop', 'bolt', 'clover'
        ];

        const COLOR_PALETTE = [
            '#f43f5e', '#ec4899', '#d946ef', '#a855f7', 
            '#8b5cf6', '#6366f1', '#3b82f6', '#0ea5e9', 
            '#06b6d4', '#14b8a6', '#10b981', '#84cc16', 
            '#eab308', '#f97316'
        ];

        const SPEED_DURATIONS = [0, 15, 12, 9, 6, 3];

        /* ----------------------------------------------------
           3. SVG描画ヘルパー（全16種類の形状に対応）
        ---------------------------------------------------- */
        function createMarkSVG(shape, color) {
            let path = '';
            switch (shape) {
                case 'circle':
                    path = `<circle cx="50" cy="50" r="40" fill="${color}" />`;
                    break;
                case 'square':
                    path = `<rect x="15" y="15" width="70" height="70" rx="12" fill="${color}" />`;
                    break;
                case 'triangle':
                    path = `<polygon points="50,12 88,82 12,82" fill="${color}" />`;
                    break;
                case 'star':
                    path = `<polygon points="50,10 61,38 90,38 66,56 75,85 50,67 25,85 34,56 10,38 39,38" fill="${color}" />`;
                    break;
                case 'heart':
                    path = `<path d="M50 85 C20 60 5 40 18 20 C28 5 45 15 50 25 C55 15 72 5 82 20 C95 40 80 60 50 85 Z" fill="${color}" />`;
                    break;
                case 'diamond':
                    path = `<polygon points="50,10 88,50 50,90 12,50" fill="${color}" />`;
                    break;
                case 'hexagon':
                    path = `<polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="${color}" />`;
                    break;
                case 'pentagon':
                    path = `<polygon points="50,10 88,38 73,85 27,85 12,38" fill="${color}" />`;
                    break;
                case 'cross':
                    path = `<path d="M35 12 H65 V35 H88 V65 H65 V88 H35 V65 H12 V35 H35 Z" fill="${color}" />`;
                    break;
                case 'cloud':
                    path = `<path d="M25 65 A 15 15 0 0 1 30 35 A 20 20 0 0 1 70 35 A 15 15 0 0 1 80 65 Z" fill="${color}" />`;
                    break;
                case 'flower':
                    path = `<g fill="${color}">
                        <circle cx="50" cy="30" r="16" /><circle cx="70" cy="50" r="16" />
                        <circle cx="50" cy="70" r="16" /><circle cx="30" cy="50" r="16" />
                        <circle cx="50" cy="50" r="12" fill="#fff" />
                    </g>`;
                    break;
                case 'crescent':
                    path = `<path d="M65 15 A 35 35 0 1 0 85 65 A 30 30 0 1 1 65 15 Z" fill="${color}" />`;
                    break;
                case 'ring':
                    path = `<path d="M50 10 A 40 40 0 1 0 50 90 A 40 40 0 1 0 50 10 Z M50 30 A 20 20 0 1 1 50 70 A 20 20 0 1 1 50 30 Z" fill="${color}" fill-rule="evenodd" />`;
                    break;
                case 'drop':
                    path = `<path d="M50 12 C50 12 82 52 82 68 A 32 32 0 0 1 18 68 C18 52 50 12 50 12 Z" fill="${color}" />`;
                    break;
                case 'bolt':
                    path = `<polygon points="58,10 22,52 48,52 42,90 78,48 52,48" fill="${color}" />`;
                    break;
                case 'clover':
                    path = `<g fill="${color}">
                        <circle cx="35" cy="35" r="18" /><circle cx="65" cy="35" r="18" />
                        <circle cx="35" cy="65" r="18" /><circle cx="65" cy="65" r="18" />
                        <rect x="46" y="60" width="8" height="28" rx="4" transform="rotate(15 50 74)" />
                    </g>`;
                    break;
                default:
                    path = `<circle cx="50" cy="50" r="40" fill="${color}" />`;
            }
            return `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-sm">${path}</svg>`;
        }

        /* ----------------------------------------------------
           4. 状態変数
        ---------------------------------------------------- */
        let configCount = 1;
        let configSpeed = 0;
        let configColor = 'colorful';

        let currentSingleColor = '#ff4d6d';
        let currentStage = 1;
        let currentQuestion = 1;
        let score = 0;
        let perfectBonus = true;
        let targetMarks = [];
        let gridMarks = [];
        let matchedCount = 0;
        let isQuestionActive = false;
        let animFrameId = null;
        let questionStartTime = 0;

        let bonusTimeLeft = 60;
        let bonusScore = 0;
        let bonusTimerId = null;
        let bonusSelectedIdx = -1;
        let bonusCards = [];

        /* ----------------------------------------------------
           5. トップ画面設定UIの処理 & ボタン高さ自動同期
        ---------------------------------------------------- */
        function syncButtonHeights() {
            const refBtn = document.getElementById('btn-speed-0');
            if (refBtn && refBtn.offsetWidth > 0) {
                const targetHeight = `${refBtn.offsetWidth}px`;
                const allButtons = document.querySelectorAll('.btn-setting');
                allButtons.forEach(btn => {
                    btn.style.height = targetHeight;
                });
            }
        }

        function updateUISelections() {
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`btn-count-${i}`);
                if (i === configCount) {
                    btn.className = "btn-setting btn-count flex-1 rounded-xl sm:rounded-2xl font-black text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-400 bg-gradient-to-b from-pink-300 to-pink-400 text-white shadow-md transform scale-102";
                } else {
                    btn.className = "btn-setting btn-count flex-1 rounded-xl sm:rounded-2xl font-extrabold text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-200 bg-white/90 text-pink-600 hover:bg-pink-100 shadow-sm";
                }
            }

            for (let i = 0; i <= 5; i++) {
                const btn = document.getElementById(`btn-speed-${i}`);
                if (i === configSpeed) {
                    btn.className = "btn-setting btn-speed flex-1 rounded-xl sm:rounded-2xl font-black transition-all flex flex-col items-center justify-center border-2 border-pink-400 bg-gradient-to-b from-pink-300 to-pink-400 text-white shadow-md transform scale-102 p-0.5";
                } else {
                    btn.className = "btn-setting btn-speed flex-1 rounded-xl sm:rounded-2xl font-black transition-all flex flex-col items-center justify-center border-2 border-pink-200 bg-white/90 text-pink-600 hover:bg-pink-100 shadow-sm p-0.5";
                }
            }

            const btnColorful = document.getElementById('btn-color-colorful');
            const btnSingle = document.getElementById('btn-color-single');
            if (configColor === 'colorful') {
                btnColorful.className = "btn-setting btn-color flex-1 rounded-xl sm:rounded-2xl font-black text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-400 bg-gradient-to-b from-pink-300 to-pink-400 text-white shadow-md transform scale-102";
                btnSingle.className = "btn-setting btn-color flex-1 rounded-xl sm:rounded-2xl font-extrabold text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-200 bg-white/90 text-pink-600 hover:bg-pink-100 shadow-sm";
            } else {
                btnSingle.className = "btn-setting btn-color flex-1 rounded-xl sm:rounded-2xl font-black text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-400 bg-gradient-to-b from-pink-300 to-pink-400 text-white shadow-md transform scale-102";
                btnColorful.className = "btn-setting btn-color flex-1 rounded-xl sm:rounded-2xl font-extrabold text-xs sm:text-base md:text-lg transition-all flex items-center justify-center border-2 border-pink-200 bg-white/90 text-pink-600 hover:bg-pink-100 shadow-sm";
            }

            syncButtonHeights();
        }

        window.addEventListener('load', () => {
            updateUISelections();
            setTimeout(syncButtonHeights, 50);
        });
        window.addEventListener('resize', syncButtonHeights);

        /* ----------------------------------------------------
           長押しコンテキストメニュー・ジェスチャーの防止
        ---------------------------------------------------- */
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        }, { passive: false });

        function selectCount(val) {
            sound.playSelect();
            configCount = val;
            updateUISelections();
        }

        function selectSpeed(val) {
            sound.playSelect();
            configSpeed = val;
            updateUISelections();
        }

        function selectColorMode(val) {
            sound.playSelect();
            configColor = val;
            updateUISelections();
        }

        /* ----------------------------------------------------
           6. メインゲーム処理
        ---------------------------------------------------- */
        function startGame() {
            sound.playSelect();
            currentStage = 1;
            currentQuestion = 1;
            score = 0;
            perfectBonus = true;

            document.getElementById('screen-top').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-bonus').classList.add('hidden');

            showStageStartBanner(currentStage, () => {
                loadQuestion();
            });
        }

        function returnToTop() {
            sound.playSelect();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            isQuestionActive = false;

            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-bonus').classList.add('hidden');
            document.getElementById('screen-top').classList.remove('hidden');
        }

        function showStageStartBanner(stageNum, callback) {
            const overlay = document.getElementById('game-overlay');
            const titleEl = document.getElementById('overlay-title');
            const subEl = document.getElementById('overlay-sub');

            titleEl.innerText = `ステージ ${stageNum}`;
            subEl.innerText = "スタート！";
            subEl.classList.remove('hidden');

            overlay.classList.remove('hidden');
            sound.playFanfare();

            setTimeout(() => {
                overlay.classList.add('hidden');
                subEl.classList.add('hidden');
                if (callback) callback();
            }, 1400);
        }

        function loadQuestion() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            
            document.getElementById('label-stage-num').innerText = `ステージ ${currentStage}`;
            document.getElementById('label-question-num').innerText = `だい ${currentQuestion} もん`;
            document.getElementById('label-score').innerText = `てんすう: ${score}`;

            if (configColor === 'single') {
                currentSingleColor = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
            }

            // 16個の完全ユニークな形状をシャッフル
            const shapesShuffled = [...SHAPES].sort(() => Math.random() - 0.5);
            const colorsShuffled = [...COLOR_PALETTE].sort(() => Math.random() - 0.5);

            gridMarks = [];
            for (let i = 0; i < 16; i++) {
                gridMarks.push({
                    id: i,
                    shape: shapesShuffled[i], // 16マス全てで重複なし！
                    color: configColor === 'colorful' ? colorsShuffled[i % COLOR_PALETTE.length] : currentSingleColor,
                    matched: false
                });
            }

            const targetIndices = [];
            while (targetIndices.length < configCount) {
                const randIdx = Math.floor(Math.random() * 16);
                if (!targetIndices.includes(randIdx)) {
                    targetIndices.push(randIdx);
                }
            }

            targetMarks = targetIndices.map((gridIdx, i) => ({
                targetId: i,
                gridId: gridIdx,
                shape: gridMarks[gridIdx].shape,
                color: gridMarks[gridIdx].color,
                matched: false
            }));

            matchedCount = 0;
            isQuestionActive = true;

            renderGrid();
            initFallArea();

            questionStartTime = performance.now();
            if (configSpeed > 0) {
                animFrameId = requestAnimationFrame(updateFallingLogic);
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('answer-grid');
            gridEl.innerHTML = '';

            gridMarks.forEach((mark, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `grid-cell-${idx}`;
                btn.className = "bg-white hover:bg-pink-100 active:scale-95 rounded-xl sm:rounded-2xl border-2 border-pink-200 p-2 sm:p-3 shadow-sm flex items-center justify-center transition-transform relative overflow-hidden aspect-square";
                btn.innerHTML = createMarkSVG(mark.shape, mark.color);
                
                btn.onclick = () => handleGridTap(idx);
                gridEl.appendChild(btn);
            });
        }

        function initFallArea() {
            const area = document.getElementById('fall-area');
            area.innerHTML = '';

            if (configSpeed === 0) {
                const container = document.createElement('div');
                container.className = "w-full flex flex-col items-center justify-center gap-2 sm:gap-4 my-auto";
                
                targetMarks.forEach((tm) => {
                    const el = document.createElement('div');
                    el.id = `target-mark-${tm.targetId}`;
                    el.className = "w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 p-2 bg-white/80 rounded-2xl border-2 border-pink-300 shadow-md flex items-center justify-center relative";
                    el.innerHTML = createMarkSVG(tm.shape, tm.color);
                    container.appendChild(el);
                });
                area.appendChild(container);
            } else {
                targetMarks.forEach((tm) => {
                    const el = document.createElement('div');
                    el.id = `target-mark-${tm.targetId}`;
                    el.className = "absolute w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 p-2 bg-white/90 rounded-2xl border-2 border-pink-300 shadow-md flex items-center justify-center transition-opacity opacity-0 pointer-events-none";
                    el.style.top = `-80px`;
                    el.innerHTML = createMarkSVG(tm.shape, tm.color);
                    area.appendChild(el);
                });
            }
        }

        function updateFallingLogic(now) {
            if (!isQuestionActive || configSpeed === 0) return;

            const elapsed = (now - questionStartTime) / 1000;
            const duration = SPEED_DURATIONS[configSpeed];
            const fallAreaEl = document.getElementById('fall-area');
            const areaHeight = fallAreaEl.clientHeight;

            let allFinishedOut = true;

            targetMarks.forEach((tm, i) => {
                const markEl = document.getElementById(`target-mark-${tm.targetId}`);
                if (!markEl) return;

                const startTime = i * 2.0;
                const markElapsed = elapsed - startTime;

                if (markElapsed < 0) {
                    markEl.style.opacity = '0';
                    allFinishedOut = false;
                } else if (markElapsed <= duration) {
                    markEl.style.opacity = '1';
                    const progress = markElapsed / duration;
                    const currentY = -80 + (areaHeight + 100) * progress;
                    markEl.style.transform = `translateY(${currentY}px)`;
                    allFinishedOut = false;
                } else {
                    markEl.style.opacity = '0';
                    markEl.style.transform = `translateY(${areaHeight + 100}px)`;
                }
            });

            if (allFinishedOut && isQuestionActive) {
                handleTimeUp();
                return;
            }

            animFrameId = requestAnimationFrame(updateFallingLogic);
        }

        function handleGridTap(gridIdx) {
            if (!isQuestionActive) return;

            const foundTarget = targetMarks.find(tm => tm.gridId === gridIdx && !tm.matched);

            if (foundTarget) {
                sound.playCorrect();
                foundTarget.matched = true;
                gridMarks[gridIdx].matched = true;
                matchedCount++;

                const cellBtn = document.getElementById(`grid-cell-${gridIdx}`);
                cellBtn.className += " bg-pink-200 border-pink-400 opacity-40 scale-95 pointer-events-none";
                
                const badge = document.createElement('div');
                badge.className = "absolute inset-0 flex items-center justify-center font-black text-2xl text-pink-600 pop-anim";
                badge.innerText = "✓";
                cellBtn.appendChild(badge);

                const targetEl = document.getElementById(`target-mark-${foundTarget.targetId}`);
                if (targetEl) {
                    const checkMark = document.createElement('div');
                    checkMark.className = "absolute -top-2 -right-2 bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-black text-xs shadow-md pop-anim z-10";
                    checkMark.innerText = "✓";
                    targetEl.appendChild(checkMark);
                }

                if (matchedCount === configCount) {
                    handleQuestionSuccess();
                }
            } else {
                sound.playWrong();
                perfectBonus = false;

                const cellBtn = document.getElementById(`grid-cell-${gridIdx}`);
                cellBtn.classList.add('shake-anim');
                setTimeout(() => {
                    cellBtn.classList.remove('shake-anim');
                }, 350);
            }
        }

        function handleQuestionSuccess() {
            isQuestionActive = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);

            score += 10;
            document.getElementById('label-score').innerText = `てんすう: ${score}`;

            showOverlay("クリア！", 800, () => {
                proceedNextQuestion();
            });
        }

        function handleTimeUp() {
            isQuestionActive = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);

            sound.playTimeUp();
            perfectBonus = false;

            showOverlay("タイムアップ！", 1000, () => {
                proceedNextQuestion();
            });
        }

        function showOverlay(text, duration, callback) {
            const overlay = document.getElementById('game-overlay');
            const titleEl = document.getElementById('overlay-title');
            const subEl = document.getElementById('overlay-sub');
            
            titleEl.innerText = text;
            subEl.classList.add('hidden');
            overlay.classList.remove('hidden');

            setTimeout(() => {
                overlay.classList.add('hidden');
                if (callback) callback();
            }, duration);
        }

        function proceedNextQuestion() {
            if (currentQuestion < 10) {
                currentQuestion++;
                loadQuestion();
            } else {
                if (perfectBonus) {
                    score += 100;
                }
                sound.playFanfare();
                startBonusStage();
            }
        }

        /* ----------------------------------------------------
           7. ボーナスステージ処理
        ---------------------------------------------------- */
        function startBonusStage() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-bonus').classList.remove('hidden');
            document.getElementById('bonus-end-overlay').classList.add('hidden');

            bonusTimeLeft = 60;
            bonusScore = score;
            bonusSelectedIdx = -1;

            document.getElementById('bonus-timer').innerText = `タイム: ${bonusTimeLeft}`;
            document.getElementById('bonus-score').innerText = `てんすう: ${bonusScore}`;

            renderBonusGrid();

            if (bonusTimerId) clearInterval(bonusTimerId);
            bonusTimerId = setInterval(() => {
                bonusTimeLeft--;
                document.getElementById('bonus-timer').innerText = `タイム: ${bonusTimeLeft}`;

                if (bonusTimeLeft <= 0) {
                    clearInterval(bonusTimerId);
                    endBonusStage();
                }
            }, 1000);
        }

        function renderBonusGrid() {
            const gridEl = document.getElementById('bonus-grid');
            gridEl.innerHTML = '';
            bonusSelectedIdx = -1;

            const shapesShuffled = [...SHAPES].sort(() => Math.random() - 0.5).slice(0, 8);
            const colorsShuffled = [...COLOR_PALETTE].sort(() => Math.random() - 0.5).slice(0, 8);

            const bonusSingleColor = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];

            const pairList = [];
            for (let i = 0; i < 8; i++) {
                const markObj = {
                    pairId: i,
                    shape: shapesShuffled[i],
                    color: configColor === 'colorful' ? colorsShuffled[i] : bonusSingleColor
                };
                pairList.push({ ...markObj, id: i * 2 });
                pairList.push({ ...markObj, id: i * 2 + 1 });
            }

            bonusCards = pairList.sort(() => Math.random() - 0.5);

            bonusCards.forEach((card, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `bonus-card-${idx}`;
                btn.className = "bg-white hover:bg-pink-100 active:scale-95 rounded-xl sm:rounded-2xl border-2 border-pink-300 p-2 shadow-sm flex items-center justify-center transition-all aspect-square";
                btn.innerHTML = createMarkSVG(card.shape, card.color);
                btn.onclick = () => handleBonusCardTap(idx);
                gridEl.appendChild(btn);
            });
        }

        function handleBonusCardTap(idx) {
            if (bonusTimeLeft <= 0) return;
            const btn = document.getElementById(`bonus-card-${idx}`);
            if (!btn || btn.classList.contains('pointer-events-none')) return;

            if (bonusSelectedIdx === -1) {
                sound.playSelect();
                bonusSelectedIdx = idx;
                btn.className = "bg-pink-200 rounded-xl sm:rounded-2xl border-4 border-pink-500 p-2 shadow-md flex items-center justify-center scale-105 transition-all";
            } else if (bonusSelectedIdx === idx) {
                sound.playSelect();
                bonusSelectedIdx = -1;
                btn.className = "bg-white hover:bg-pink-100 active:scale-95 rounded-xl sm:rounded-2xl border-2 border-pink-300 p-2 shadow-sm flex items-center justify-center transition-all";
            } else {
                const prevIdx = bonusSelectedIdx;
                const prevBtn = document.getElementById(`bonus-card-${prevIdx}`);
                bonusSelectedIdx = -1;

                if (bonusCards[prevIdx].pairId === bonusCards[idx].pairId) {
                    sound.playCorrect();
                    bonusScore += 10;
                    document.getElementById('bonus-score').innerText = `てんすう: ${bonusScore}`;

                    [prevBtn, btn].forEach(b => {
                        b.className = "bg-pink-100 opacity-20 scale-90 pointer-events-none rounded-xl sm:rounded-2xl border border-pink-200 p-2 flex items-center justify-center";
                    });

                    const remaining = document.querySelectorAll('#bonus-grid button:not(.pointer-events-none)');
                    if (remaining.length === 0) {
                        setTimeout(() => {
                            renderBonusGrid();
                        }, 300);
                    }
                } else {
                    sound.playWrong();
                    btn.classList.add('shake-anim');
                    prevBtn.classList.add('shake-anim');

                    setTimeout(() => {
                        btn.classList.remove('shake-anim');
                        prevBtn.classList.remove('shake-anim');
                        btn.className = "bg-white hover:bg-pink-100 active:scale-95 rounded-xl sm:rounded-2xl border-2 border-pink-300 p-2 shadow-sm flex items-center justify-center transition-all";
                        prevBtn.className = "bg-white hover:bg-pink-100 active:scale-95 rounded-xl sm:rounded-2xl border-2 border-pink-300 p-2 shadow-sm flex items-center justify-center transition-all";
                    }, 350);
                }
            }
        }

        function endBonusStage() {
            sound.playFanfare();
            document.getElementById('bonus-finish-title').innerText = "クリア！";
            document.getElementById('bonus-final-score').innerText = `ごうけい てんすう: ${bonusScore}`;
            document.getElementById('bonus-end-overlay').classList.remove('hidden');
        }

        function nextStageFromBonus() {
            sound.playSelect();
            currentStage++;
            currentQuestion = 1;
            score = bonusScore; // 得点を引き継ぐ
            perfectBonus = true;

            document.getElementById('screen-bonus').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');

            showStageStartBanner(currentStage, () => {
                loadQuestion();
            });
        }
    </script>
</body>
</html>
